# IG-posztoló — GitHub Actions cron (UTC!). SŰRŰ POLLING: minden 15. percben egy tág napi
# ablakban, hogy BÁRMILYEN felhasználó-választotta időpontot elkapjon (nem csak a 3 fix sávot),
# Mac nélkül is. A UI 15-perces időpontjaihoz (:00/:15/:30/:45) pontosan illeszkedik.
# A state.json + concurrency véd a dupla poszt ellen. Nem kell DST-igazítás (a tág ablak fedi).
name: ig-post
on:
  schedule:
    # ⚠️ 2026-09-30 MÉRVE: a GitHub ezt a `*/10`-et a gyakorlatban csak 5–6 óránként futtatta (terhelés-
    # függő, publikus repón ismert). Ezért ez csak TARTALÉK. A pontos indítás: (1) ébren lévő Mac esedékességkor
    # push-sal lök (felho_atad._tick), (2) külső időzítő workflow_dispatch-csel (cron-job.org, README).
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ig-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: post due jobs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 ig_post.py
      - name: tiktok drafts
        if: always()
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python3 tt_post.py
      - name: commit state
        if: always()
        # 2026-09-30: a Mac is ír a state.json-ba → sima rebase-nél ütközhet, és akkor a felhő posztja
        # nem kerül be (a Mac 20 perc múlva újraposztolná). Az allapot.py összefésüli a kettőt és újrapróbál.
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          python3 allapot.py push "state: posted"
